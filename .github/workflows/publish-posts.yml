name: Publish scheduled posts

# Every 30 minutes keeps the free Neon database asleep for most of the day.
on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:

permissions:
  id-token: write
  contents: none

concurrency:
  group: publish-posts
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ask the site to publish what is due
        run: |
          token=$(curl -fsS -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=kaara-publish-posts" | jq -r .value)
          curl -fsS --max-time 75 -X POST -H "Authorization: Bearer $token" \
            https://www.kaararealtygroup.com/api/cron/publish-posts
